[workspace]
resolver = "2"
members = [
    "crates/tars-core",
    "crates/tars-protocol",
    "crates/tars-util",
    "crates/tars-transport",
    "crates/tars-registry",
    "crates/tars-rpc",
    "crates/tars",
]
default-members = ["crates/tars"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TarsRust Team"]
license = "BSD-3-Clause"
repository = "https://github.com/TarsCloud/TarsRust"

[workspace.dependencies]
# Internal crates
tars-core = { path = "crates/tars-core", version = "0.1.0" }
tars-protocol = { path = "crates/tars-protocol", version = "0.1.0" }
tars-util = { path = "crates/tars-util", version = "0.1.0" }
tars-transport = { path = "crates/tars-transport", version = "0.1.0" }
tars-registry = { path = "crates/tars-registry", version = "0.1.0" }
tars-rpc = { path = "crates/tars-rpc", version = "0.1.0" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Networking
tokio-rustls = "0.25"
rustls = "0.22"
rustls-pemfile = "2.0"
webpki-roots = "0.26"

# Serialization
bytes = "1.5"
byteorder = "1.5"

# Errors / utilities
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
dashmap = "5.5"
once_cell = "1.19"
rand = "0.8"
crc32fast = "1.3"
md-5 = "0.10"
hex = "0.4"

# Time
chrono = "0.4"

# Async traits
async-trait = "0.1"

# Config / serde
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Signals
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }

# Atomics
crossbeam = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
